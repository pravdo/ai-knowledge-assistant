[project]
name = "ingestion"
version = "0.1.0"
description = "Python ingestion worker: validates uploads, extracts and chunks text, generates embeddings, and indexes documents."
authors = [
    { name = "praavdo", email = "pravdo00@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aws-lambda-powertools==3.31.1",
    "boto3==1.43.67",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/ingestion --cov-report=term-missing"
